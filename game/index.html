<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher — a tiny game built from one prompt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0620; }
  body {
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 18px 0 0;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
    background: linear-gradient(180deg, #0b0620 0%, #1a0b3d 55%, #2b1155 100%);
    overflow: hidden;
  }
  h1 {
    font-size: 44px; letter-spacing: 2px; color: #ffd94a;
    text-shadow: 0 0 24px rgba(255, 217, 74, .55);
  }
  #hud {
    display: flex; gap: 34px; margin: 10px 0 12px;
    font-size: 30px; font-weight: 700;
  }
  #hud span b { color: #ffd94a; }
  #timer b { color: #7df9ff; }
  canvas {
    border-radius: 18px;
    box-shadow: 0 0 0 3px rgba(255, 217, 74, .35), 0 18px 60px rgba(0,0,0,.6);
    background: #120a33;
    touch-action: none;
  }
  #hint { margin-top: 12px; font-size: 24px; color: #cfc4f5; }
</style>
</head>
<body>
  <h1>⭐ STAR CATCHER</h1>
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span id="timer">TIME <b>30</b>s</span>
    <span>LIVES <b id="lives">♥♥♥</b></span>
  </div>
  <canvas id="game" width="900" height="1250"></canvas>
  <div id="hint">Move with mouse, touch or ← → keys — catch the stars!</div>
<script>
"use strict";
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

const state = {
  score: 0, lives: 3, timeLeft: 30,
  running: true, over: false,
  basketX: W / 2, basketW: 190, basketH: 34,
  stars: [], parts: [], floats: [],
  spawnT: 0, elapsed: 0, combo: 0,
};

const sky = [];
for (let i = 0; i < 90; i++) {
  sky.push({ x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 2 + 0.6, tw: Math.random() * Math.PI * 2 });
}

function spawnStar() {
  const gold = Math.random() < 0.16;
  state.stars.push({
    x: 40 + Math.random() * (W - 80),
    y: -30,
    vy: 260 + Math.random() * 260 + (30 - state.timeLeft) * 9,
    r: gold ? 26 : 20,
    gold, spin: Math.random() * Math.PI * 2,
    drift: (Math.random() - 0.5) * 60,
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
      life: 0.7, color, r: 3 + Math.random() * 4 });
  }
}

function drawStar(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = i * Math.PI / 5 - Math.PI / 2;
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBasket() {
  const x = state.basketX - state.basketW / 2, y = H - 90;
  ctx.fillStyle = "#8a5a2b";
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + state.basketW, y);
  ctx.lineTo(x + state.basketW - 18, y + state.basketH + 26);
  ctx.lineTo(x + 18, y + state.basketH + 26);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#5e3a17"; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x + 12, y + 14); ctx.lineTo(x + state.basketW - 12, y + 14);
  ctx.moveTo(x + 20, y + 30); ctx.lineTo(x + state.basketW - 20, y + 30);
  ctx.stroke();
  ctx.fillStyle = "#ffd94a";
  ctx.beginPath();
  ctx.ellipse(state.basketX, y - 4, state.basketW / 2, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

function update(dt) {
  if (!state.running) return;
  state.elapsed += dt;
  state.timeLeft = Math.max(0, 30 - state.elapsed);
  if (state.timeLeft <= 0) { endGame(); return; }

  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnStar();
    state.spawnT = Math.max(0.22, 0.62 - (30 - state.timeLeft) * 0.012);
  }

  const basketY = H - 90;
  for (const s of state.stars) {
    s.y += s.vy * dt;
    s.x += s.drift * dt;
    s.spin += dt * 2;
    if (s.y > basketY - 8 && s.y < basketY + 40 &&
        Math.abs(s.x - state.basketX) < state.basketW / 2 + s.r * 0.5) {
      s.caught = true;
      state.combo++;
      const pts = s.gold ? 25 : 10;
      state.score += pts;
      burst(s.x, s.y, s.gold ? "#ffd94a" : "#7df9ff", s.gold ? 26 : 16);
      state.floats.push({ x: s.x, y: s.y - 20, txt: "+" + pts, life: 0.9,
        color: s.gold ? "#ffd94a" : "#ffffff" });
      if (state.combo >= 5) {
        state.floats.push({ x: W / 2, y: 300, txt: "COMBO x" + state.combo + "!",
          life: 1.1, color: "#ff9de2", big: true });
      }
    } else if (s.y > H + 30) {
      s.missed = true;
      state.combo = 0;
      state.lives--;
      burst(s.x, H - 30, "#ff5a5a", 10);
      if (state.lives <= 0) { endGame(); return; }
    }
  }
  state.stars = state.stars.filter(s => !s.caught && !s.missed);

  for (const p of state.parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
  }
  state.parts = state.parts.filter(p => p.life > 0);
  for (const f of state.floats) { f.y -= 40 * dt; f.life -= dt; }
  state.floats = state.floats.filter(f => f.life > 0);
}

function endGame() {
  state.running = false; state.over = true;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#120a33"); g.addColorStop(1, "#241155");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  for (const s of sky) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.5 + s.tw));
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const s of state.stars) {
    ctx.shadowColor = s.gold ? "#ffd94a" : "#7df9ff";
    ctx.shadowBlur = 22;
    drawStar(s.x, s.y, s.r, s.spin, s.gold ? "#ffd94a" : "#8ef1ff");
  }
  ctx.shadowBlur = 0;
  for (const p of state.parts) {
    ctx.globalAlpha = Math.max(0, p.life / 0.7);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawBasket();
  ctx.textAlign = "center";
  for (const f of state.floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = f.big ? "bold 54px sans-serif" : "bold 40px sans-serif";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (state.over) {
    ctx.fillStyle = "rgba(10,4,28,0.78)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd94a";
    ctx.font = "bold 84px sans-serif";
    ctx.fillText("TIME'S UP!", W / 2, H / 2 - 60);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 56px sans-serif";
    ctx.fillText("Final score: " + state.score, W / 2, H / 2 + 30);
    ctx.fillStyle = "#7df9ff";
    ctx.font = "32px sans-serif";
    ctx.fillText("Refresh to play again", W / 2, H / 2 + 100);
  }

  document.getElementById("score").textContent = state.score;
  document.getElementById("timer").firstElementChild.textContent =
    Math.ceil(state.timeLeft);
  document.getElementById("lives").textContent =
    "♥".repeat(Math.max(0, state.lives)) + "♡".repeat(Math.max(0, 3 - state.lives));
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

const keys = {};
addEventListener("keydown", e => { keys[e.key] = true; });
addEventListener("keyup", e => { keys[e.key] = false; });
addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  state.basketX = Math.max(state.basketW / 2,
    Math.min(W - state.basketW / 2, (e.clientX - r.left) * (W / r.width)));
});
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const t = e.touches[0];
  state.basketX = Math.max(state.basketW / 2,
    Math.min(W - state.basketW / 2, (t.clientX - r.left) * (W / r.width)));
}, { passive: false });

setInterval(() => {
  if (keys["ArrowLeft"]) state.basketX = Math.max(state.basketW / 2, state.basketX - 14);
  if (keys["ArrowRight"]) state.basketX = Math.min(W - state.basketW / 2, state.basketX + 14);
}, 16);

requestAnimationFrame(loop);
</script>
</body>
</html>
